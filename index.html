<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f8">
  <meta name="description" content="Termine, Kostüme, Packlisten und Notizen für die Karnevalssession.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Karneval">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Karnevals-Buddy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="preload" href="fonts/titan-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/art.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="#start" aria-label="Karnevals-Buddy, zum Start">
        <svg class="brand-mark" viewBox="0 0 120 64" aria-hidden="true">
          <path class="brand-end" d="M36 32L8 9L14 19L5 25L13 32L5 39L14 45L8 55Z"/>
          <path class="brand-end" d="M84 32L112 9L106 19L115 25L107 32L115 39L106 45L112 55Z"/>
          <rect class="brand-body" x="26" y="12" width="68" height="40" rx="20"/>
          <rect x="37" y="19" width="20" height="5" rx="2.5" fill="#fff" opacity=".7"/>
        </svg>
        <span class="brand-name">Karnevals-<br>Buddy</span>
      </a>
      <nav id="nav" class="nav" aria-label="Bereiche"></nav>
      <button type="button" id="settings-button" class="rail-settings" aria-label="Einstellungen">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
        <span>Einstellungen</span>
      </button>
    </aside>
    <main id="view" class="view"></main>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <canvas id="burst" class="burst" aria-hidden="true"></canvas>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/store.js"></script>
  <script src="js/surprises.js"></script>
  <script src="js/start.js"></script>
  <script src="js/events.js"></script>
  <script src="js/costumes.js"></script>
  <script src="js/packing.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/art.js"></script>
  <script src="js/formations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
